// =====================================================
//  WolFox GPS Module — build.gradle (app)
// =====================================================

plugins { id 'com.android.application' }

android {
    namespace 'com.wolfox.gps'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        applicationId 'com.wolfox.gps'
        versionCode 312
        versionName "3.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

}

dependencies {
    // LSPosed / Xposed API
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    // لا نحتاج dependencies إضافية — كل شيء مدمج
}
