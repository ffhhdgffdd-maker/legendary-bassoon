name: Build WolFox Test Modules

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['app/**', 'stubs/**', 'profiles/**', 'tests/**', 'build-local.sh', 'build-all-test-variants.sh', '.github/workflows/build.yml']
  pull_request:
    paths: ['app/**', 'stubs/**', 'profiles/**', 'tests/**', 'build-local.sh', 'build-all-test-variants.sh']

permissions:
  contents: read

concurrency:
  group: wolfox-test-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Run safety and compatibility tests
        run: |
          python3 tests/verify_no_root_dependency.py
          python3 tests/verify_provider_compatibility.py
          python3 tests/verify_icon_lifecycle_fix.py
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WOLFOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keys
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keys/wolfox-test.jks
          fi
      - name: Configure signing environment
        env:
          RELEASE_STORE_PASS: ${{ secrets.WOLFOX_KEYSTORE_PASS }}
          RELEASE_KEY_PASS: ${{ secrets.WOLFOX_KEY_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.WOLFOX_KEY_ALIAS }}
        run: |
          if [ -n "$RELEASE_STORE_PASS" ]; then
            echo "WOLFOX_KEYSTORE_PASS=$RELEASE_STORE_PASS" >> "$GITHUB_ENV"
            echo "WOLFOX_KEY_PASS=${RELEASE_KEY_PASS:-$RELEASE_STORE_PASS}" >> "$GITHUB_ENV"
            echo "WOLFOX_KEY_ALIAS=${RELEASE_KEY_ALIAS:-wolfox-module}" >> "$GITHUB_ENV"
          else
            temporary_password="$(openssl rand -hex 24)"
            echo "WOLFOX_KEYSTORE_PASS=$temporary_password" >> "$GITHUB_ENV"
            echo "WOLFOX_KEY_PASS=$temporary_password" >> "$GITHUB_ENV"
            echo "WOLFOX_KEY_ALIAS=wolfox-module" >> "$GITHUB_ENV"
          fi
      - name: Build SAFE CAMERA MULTI
        run: |
          set -euo pipefail
          export ANDROID_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          export ANDROID_PLATFORM_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          export WOLFOX_KEYSTORE_PATH="$GITHUB_WORKSPACE/keys/wolfox-test.jks"
          chmod +x build-local.sh build-all-test-variants.sh
          ./build-all-test-variants.sh
      - name: Verify APKs and profiles
        run: |
          set -euo pipefail
          for profile in SAFE CAMERA MULTI; do
            apk="dist/WolFox-Test-${profile}-v3.2.0-SIGNED.apk"
            unzip -t "$apk"
            unzip -p "$apk" assets/xposed_init | grep -F 'com.wolfox.gps.hook.WolFoxHook'
            unzip -p "$apk" classes.dex | strings | grep -Fx "$profile"
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
          sha256sum -c dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WolFox-Test-Modules-v3.2.0-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

# Triggered for the clean no-root favorites source archive.
